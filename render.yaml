# ========================================================
# WebPoster Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec
# ========================================================

services:
  # ------------------------------------------------------
  # WebPoster Backend (Spring Boot 4 / Java 21)
  # ------------------------------------------------------
  - type: web
    name: webposter-server
    runtime: docker
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_POOL_MIN
        value: "2"
      - key: JPA_DDL_AUTO
        value: update
      - key: SHOW_SQL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_TIME
        value: "604800000"
      - key: JWT_ACCESS_TIME
        value: "900000"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: None
      - key: CORS_ALLOWED_ORIGINS
        value: "https://webposter-client.onrender.com,https://*.onrender.com,http://localhost:5173,http://localhost"

  # ------------------------------------------------------
  # WebPoster Frontend (React 19 / Vite / Tailwind v4)
  # ------------------------------------------------------
  - type: web
    name: webposter-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://webposter-server.onrender.com/api/v1
